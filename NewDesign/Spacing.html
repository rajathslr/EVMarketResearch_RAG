<!-- @dsCard group="Spacing" name="Spacing, radii & elevation" subtitle="Spacing scale, corner radii, shadows, density" viewport="720x520" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { margin: 0; padding: 28px; background: #fff; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 26px 0 14px; }
  h3:first-child { margin-top: 0; }
  .spaces { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .space { text-align: center; }
  .space__bar { background: var(--accent); border-radius: 3px; width: 100%; }
  .space__lbl { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .radii { display: flex; gap: 16px; flex-wrap: wrap; }
  .radius { width: 90px; height: 70px; background: var(--accent-soft); border: 1px solid var(--accent); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 11px; color: var(--accent); font-weight: 600; }
  .shadows { display: flex; gap: 22px; flex-wrap: wrap; }
  .shadow { width: 130px; height: 80px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body class="volt">
  <h3>Spacing scale</h3>
  <div class="spaces" id="spaces"></div>

  <h3>Corner radii</h3>
  <div class="radii">
    <div class="radius" style="border-radius:var(--r-sm)">sm 6</div>
    <div class="radius" style="border-radius:var(--r-md)">md 8</div>
    <div class="radius" style="border-radius:var(--r-lg)">lg 10</div>
    <div class="radius" style="border-radius:var(--r-xl)">xl 14</div>
    <div class="radius" style="border-radius:var(--r-full)">full</div>
  </div>

  <h3>Elevation</h3>
  <div class="shadows">
    <div class="shadow" style="box-shadow:var(--shadow-sm)">shadow-sm</div>
    <div class="shadow" style="box-shadow:var(--shadow-md)">shadow-md</div>
    <div class="shadow" style="box-shadow:var(--shadow-lg)">shadow-lg</div>
  </div>
<script>
  const scale = [["1",4],["2",8],["3",12],["4",16],["5",20],["6",24],["8",32],["10",40],["12",48]];
  document.getElementById("spaces").innerHTML = scale.map(([n, px]) =>
    `<div class="space" style="width:${px}px"><div class="space__bar" style="height:${px}px"></div><div class="space__lbl">${px}</div></div>`
  ).join("");
</script>
</body>
</html>
