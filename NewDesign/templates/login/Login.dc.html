<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Login" description="Centered sign-in card on a light grey background, with inline error state." -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<script src="./ds-base.js"></script>
<style> html, body { margin: 0; height: 100%; } </style>
</helmet>

<div data-accent="{{ accent }}" data-font="{{ font }}" data-density="{{ density }}" data-screen-label="Login"
     style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--surface); font-family:var(--font-sans); color:var(--text);">

  <div style="width:100%; max-width:380px; background:var(--bg); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg); padding:32px 30px;">

    <!-- Brand -->
    <div style="text-align:center; margin-bottom:24px;">
      <div style="width:52px; height:52px; margin:0 auto 14px; border-radius:14px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:26px;">⚡</div>
      <h1 style="margin:0 0 6px; font-size:20px; font-weight:700;">Home Energy &amp; EV Research</h1>
      <p style="margin:0; font-size:13px; color:var(--text-secondary); line-height:1.5;">Competitive intelligence on North American home energy &amp; EV charging apps</p>
    </div>

    <!-- Form -->
    <form onSubmit="{{ onSubmit }}" style="display:flex; flex-direction:column; gap:16px;">
      <x-import component-from-global-scope="VoltEVEnergyResearchDesignSystem_1e451b.TextField" label="Username" value="{{ username }}" onChange="{{ onUser }}" placeholder="you@company.com" hint-size="100%,62px"></x-import>
      <x-import component-from-global-scope="VoltEVEnergyResearchDesignSystem_1e451b.TextField" label="Password" type="password" value="{{ password }}" onChange="{{ onPass }}" error="{{ error }}" placeholder="••••••••" hint-size="100%,62px"></x-import>

      <x-import component-from-global-scope="VoltEVEnergyResearchDesignSystem_1e451b.Button" variant="primary" block="{{ true }}" type="submit" onClick="{{ onSubmit }}" hint-size="100%,38px">Sign In</x-import>
    </form>

    <p style="margin:18px 0 0; text-align:center; font-size:12px; color:var(--text-muted);">Access is restricted to authorized analysts.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 560 },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;indigo&quot;, &quot;violet&quot;, &quot;teal&quot;, &quot;blue&quot;, &quot;emerald&quot;, &quot;amber&quot;], &quot;default&quot;: &quot;indigo&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;font&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;system&quot;, &quot;plex&quot;, &quot;source&quot;], &quot;default&quot;: &quot;system&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;density&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;comfortable&quot;, &quot;compact&quot;], &quot;default&quot;: &quot;comfortable&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  state = { username: "", password: "", error: "" };

  submit() {
    const ok = this.state.username.trim() && this.state.password === "demo";
    this.setState({ error: ok ? "" : "Incorrect username or password" });
  }

  renderVals() {
    return {
      accent: this.props.accent || "indigo",
      font: this.props.font || "system",
      density: this.props.density || "comfortable",
      username: this.state.username,
      password: this.state.password,
      error: this.state.error,
      onUser: (e) => this.setState({ username: e.target.value, error: "" }),
      onPass: (e) => this.setState({ password: e.target.value, error: "" }),
      onSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.submit(); },
    };
  }
}
</script>
</body>
</html>
