<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 28px; background: #fff; }
  .stack { display: flex; flex-direction: column; gap: 18px; max-width: 680px; }
</style>
</head>
<body class="volt">
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { ChatBubble, Expander, SourceChunk, FeedbackBar, ExamplePill } = window.VoltEVEnergyResearchDesignSystem_1e451b;
  const ANSWER = `### Fastest-charging experiences\nAcross reviews, three apps stand out for **reliability**:\n\n1. *VoltGo* — praised for accurate availability data\n2. *ChargeMate* — fastest session start times\n3. *GridFlow* — best route planning\n\n| App | Avg. rating | Sessions |\n|---|---|---|\n| VoltGo | 4.6 | 1,204 |\n| ChargeMate | 4.4 | 980 |\n\n> "Plug in and the app already knows you're there." — Google Play review`;

  function Demo() {
    const [active, setActive] = React.useState(["up"]);
    const [comment, setComment] = React.useState("");
    const react = (k) => setActive((a) => a.includes(k) ? a.filter((x) => x !== k) : [...a, k]);
    const sources = (
      <Expander title="View 3 source chunks" defaultOpen={true}>
        <SourceChunk app="VoltGo" source="google_play" score={0.91} text="The app instantly detected my car at the station and started the session without me tapping anything." />
        <SourceChunk app="ChargeMate" source="app_store" score={0.87} text="Session start is near-instant compared to competitors I've used over the past year." />
        <SourceChunk app="GridFlow" source="news" score={0.82} text="GridFlow's latest update overhauls route planning with live charger availability." />
      </Expander>
    );
    return (
      <div className="stack">
        <ChatBubble role="user" name="Jordan Lee">Which EV charging apps have the most reliable real-time availability?</ChatBubble>
        <ChatBubble role="assistant" footer={
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {sources}
            <FeedbackBar
              tokens={{ in: 5051, out: 486, total: 5537, model: "claude-sonnet-4-6" }}
              active={active} onReact={react} comment={comment} onComment={setComment} />
          </div>
        }>{ANSWER}</ChatBubble>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <ExamplePill>Compare prosumer apps on battery management</ExamplePill>
          <ExamplePill>What do users complain about most?</ExamplePill>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
